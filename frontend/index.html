<!DOCTYPE html>

  <!-- §Faz 8: Google Translate is gone (real i18n system instead, see
       src/i18n/), so this CSP no longer needs translate.google.com /
       gstatic.com / recaptcha.net. img-src stays "https:" broad rather
       than narrowed to flagcdn.com only, because uploaded image paths
       stored in the database could in principle be absolute external
       URLs (see src/lib/sanitize.ts::sanitizeImgSrc, which allows them) —
       narrow this only after confirming no such URL exists in the DB. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; connect-src 'self';">
