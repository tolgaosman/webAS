<!DOCTYPE html>
<html lang="tr" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Translate is back (restored from pre-§Faz 8 history, see
       src/i18n/googleTranslate.ts's docblock) — this CSP is loosened
       back to what it was before §Faz 8 removed it: script-src needs
       'unsafe-inline' (element.js injects an inline init call) plus
       Google's own script/frame hosts; style-src/connect-src need the
       matching Google hosts too. This is scoped to the public entry
       only — admin.html's CSP stays untouched/strict, the admin panel
       never loads this widget. img-src stays "https:" broad rather than
       narrowed to flagcdn.com only, because uploaded image paths stored
       in the database could in principle be absolute external URLs (see
       src/lib/sanitize.ts::sanitizeImgSrc, which allows them) — narrow
       this only after confirming no such URL exists in the DB. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://translate.google.com https://translate.googleapis.com https://translate-pa.googleapis.com https://www.gstatic.com https://www.google.com https://www.recaptcha.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://translate.googleapis.com https://www.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; frame-src 'self' https://www.google.com https://www.recaptcha.net; object-src 'none'; base-uri 'self'; form-action 'self'; connect-src 'self' https://translate.googleapis.com https://translate-pa.googleapis.com https://www.google.com;">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/browserLogo.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/browserLogo.png">
  <link rel="shortcut icon" href="/browserLogo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/browserLogo.png">

  <!-- SEO Meta Tags -->
  <title>Alara Soysan | Marketing & Branding Portfolio</title>
  <meta name="description"
    content="Alara Soysan's digital marketing, brand management and organisational development portfolio. Rotterdam Business School.">
  <meta name="keywords"
    content="Alara Soysan, Portfolio, Digital Marketing, Rotterdam, Turkcell Intern, Social Media Campaign, Employer Branding">
  <meta name="author" content="Alara Soysan">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/entries/public/main.tsx"></script>
</body>

</html>
