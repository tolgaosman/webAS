; Overrides for the stock php:8.3-fpm-alpine image (§Faz 8, hata #5).
; Without these, uploads over 2MB never reach Laravel at all — PHP
; rejects them before $request->file('file') is populated, producing
; the misleading "Dosya bulunamadı." error instead of a size error.
; nginx's client_max_body_size (10m) and the app's own 8MB check in
; PortfolioController only matter once these are raised past them.
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 60
expose_php = Off
