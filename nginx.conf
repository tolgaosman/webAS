# Bootstrap config: HTTP-only, used to obtain the first Let's Encrypt cert.
# Once `docker compose run --rm certbot certonly --webroot ...` succeeds,
# replace this file with the HTTPS version (see deployment notes) and
# `docker compose up -d --build web` to reload with TLS.
#
# §Faz 8: frontend (Vite dist/) and the Laravel API are served from this
# ONE nginx server so they stay same-origin — that's what lets the
# auth_token cookie's sameSite=strict flag keep working (see
# migration plan §Faz 5/§Faz 8, and AuthController's docblock).

server {
    listen 80;
    server_name alarasysn.com www.alarasysn.com;

    root /usr/share/nginx/html;
    index index.html;

    # §Faz 0.4: the legacy default (no directive = nginx's built-in 1MB)
    # silently capped multer's 8MB upload limit at 1MB. Raised to match
    # Laravel's own 8MB validation rule now that assets are uploaded
    # through the admin panel as the primary path for getting them onto
    # the site (see migration plan, "Upload boyut limiti" decision).
    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Uploaded images — same bind-mounted directory the php container
    # writes to (see docker-compose.yml's "uploads" volume).
    location /assets/uploads/ {
        alias /var/www/uploads/;
    }

    # Laravel API. SCRIPT_FILENAME always points at the front controller;
    # Laravel's own router reads REQUEST_URI to match routes/api.php
    # (which Laravel auto-prefixes with /api), so nginx does not need to
    # resolve /api/* to real files the way it does for the SPA below.
    location /api/ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS $https if_not_empty;
    }

    # Everything else: the static SPA build (Vite dist/, includes both
    # index.html and admin_panel.html as separate entry points).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
