# HTTPS / SSL Config for webAS
# Once you successfully obtain the Let's Encrypt certificates using Certbot,
# replace the contents of nginx.conf with this file.

server {
    listen 80;
    server_name alarasysn.com www.alarasysn.com;

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Allow Certbot to verify ACME challenges over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl http2;
    server_name alarasysn.com www.alarasysn.com;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/alarasysn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alarasysn.com/privkey.pem;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Uploaded images
    location /assets/uploads/ {
        alias /var/www/uploads/;
    }

    # Laravel API proxy to PHP-FPM
    location /api/ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS $https if_not_empty;
    }

    # Admin Panel Route Fix
    location = /admin {
        try_files /admin.html =404;
    }

    # Cache Vite build assets
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
