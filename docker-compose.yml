version: '3.8'

# §Faz 8 topology: nginx (web) + php-fpm (Laravel API) + MySQL + Redis
# SSL is handled by Caddy on the host (reverse proxy).
# web and php share ONE origin (see nginx.conf) — same-origin is required
# for the auth_token cookie's sameSite=strict flag to keep working.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4001:80"
    volumes:
      - ./uploads:/var/www/uploads:ro
    depends_on:
      - php
    restart: always

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Port 9000 is not exported to the host — only nginx (the "web"
    # service) talks to it, over the compose network.
    env_file:
      - ./backend/.env
    volumes:
      - ./uploads:/var/www/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-webas}
      - MYSQL_USER=${DB_USERNAME:-webas}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: always

volumes:
  mysql-data:
  redis-data:

# ./uploads is a plain host bind-mount (not a named volume above) —
# both web (read-only serving) and php (writes uploads) mount it; see
# nginx.conf's /assets/uploads/ location and backend's public_uploads
# disk (backend/config/filesystems.php, backend/README.md). This is NOT
# the same directory as frontend/public/assets/uploads/, which is build
# input baked into the "web" image, not runtime storage — mkdir -p
# ./uploads and move any existing live images there before first
# `docker compose up` (see migration plan §Faz 8 cutover checklist).
